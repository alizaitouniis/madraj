# Local MySQL for the backend. Matches backend/.env.example.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: madraj
      MYSQL_USER: madraj
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
